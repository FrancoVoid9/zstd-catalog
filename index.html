* {

}

html {

}

body {

header {

header h1 {

.brand {

}

.brand img {

}

.count {
  color: var(--text);
  font-weight: 600;
}

/* Botón Facebook */
.fb-btn {
  background: var(--accent);
  color: #fff;
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  padding: 9px 16px;
  border-radius: 8px;
  transition: opacity .15s;
  white-space: nowrap;
}

.fb-btn:hover {

}

/* Contenedor de switch y Facebook */
.header-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}

/* Switch de tema */
.theme-switch {
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  user-select: none;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
}

.theme-switch input {
  display: none;
}

.switch-track {
  position: relative;
  width: 48px;
  height: 26px;
  background: #64748b;
  border-radius: 20px;
  transition: background .2s;
  flex-shrink: 0;
}

.switch-track::before {
  content: "🌙";
  position: absolute;
  width: 20px;
  height: 20px;
  left: 3px;
  top: 3px;
  background: white;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 12px;
  transition: transform .2s;
}

.theme-switch input:checked + .switch-track {
  background: var(--accent);
}

.theme-switch input:checked + .switch-track::before {
  content: "☀️";
  transform: translateX(22px);
}

.theme-switch input:focus-visible + .switch-track {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

/* Barra de búsqueda y controles */
.bar {
  display: grid;
  grid-template-columns: 1fr minmax(0, 420px) 1fr;
  gap: 10px;
  align-items: center;
  max-width: 1500px;
  margin: 0 auto 18px;
}

input, button {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  font: inherit;
  font-size: 13px;
}

input {
  grid-column: 2;
  width: 100%;
}

#view {
  grid-column: 3;
  justify-self: end;
}

#sort {
  grid-column: 1;
  justify-self: start;
}

button {
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Cuadrícula */
.grid {
  max-width: 1500px;
  margin: 0 auto;
  display: grid;
  gap: 18px;
  grid-template-columns: repeat(6, 1fr);
}

@media (max-width: 1100px) {
  .grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

@media (max-width: 800px) {
  .grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 560px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* Tarjetas */
.card {
  display: block;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  color: inherit;
  text-decoration: none;
  transition: border-color .15s, transform .15s;
}

.card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
}

.cover {
  position: relative;
  aspect-ratio: 3 / 4;
  background-size: cover;
  background-position: center;
}

.cover .initials {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 44px;
  font-weight: 700;
  color: rgba(255,255,255,.85);

}

}

  left: 8px;
}

.chip.ver {
  right: 8px;
}

.info {
  padding: 10px 12px 12px;
}

.title {

.id {

.tags {

.tag {

.tag.credits {

}

.tag.notes {

.link-selector {

  padding: 7px;

  color: var(--text);

/* Animación de aparición */
@keyframes menuAppear {
  from {

    transform: scale(.94);

  to {
    opacity: 1;
    transform: scale(1);
  }

  border-radius: 7px;
  font-size: 13px;
  font-weight: 600;
  transition: background .15s, color .15s, transform .15s;
}

/* Efecto al pasar el cursor */
.link-selector a:hover,
.link-selector a:focus-visible {
  background: var(--tag-bg);
  color: var(--accent);
  transform: translateX(3px);
}

.grid.list .info {

.empty {

    font-size: 13px;

    ampr: "v0.3.4", firmware: "4.xx+", credits: "Alejandro",
    notes: "" },

];

/* ============================================= */

/* ============ ELEMENTOS PRINCIPALES ============ */

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const viewBtn = document.getElementById('view');

/* ============ CAMBIO DE TEMA ============ */

const themeToggle = document.getElementById('themeToggle');
const themeLabel = document.getElementById('themeLabel');

// Recuperar tema guardado
const savedTheme = localStorage.getItem('theme');

// El tema predeterminado será oscuro
const initialTheme = savedTheme || 'dark';

// Aplicar tema
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);

  themeToggle.checked = theme === 'light';

  themeLabel.textContent = theme === 'light'
    ? 'Claro'
    : 'Oscuro';

  localStorage.setItem('theme', theme);
}

// Aplicar tema inicial
setTheme(initialTheme);

// Escuchar cambios del switch
themeToggle.addEventListener('change', () => {
  setTheme(themeToggle.checked ? 'light' : 'dark');
});

/* ============================================= */

let activeMenu = null;

function hue(str) {
  let h = 0;

  for (const c of str) {
    h = (h * 31 + c.charCodeAt(0)) % 360;
  }

  return h;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function safeUrl(u) {
  try {
    const p = new URL(u, location.href);
    return /^https?:$/.test(p.protocol) ? p.href : null;
  } catch {
    return null;
  }
}

/* Cierra el selector si ya hay uno abierto */
function closeLinkMenu() {
  if (activeMenu) {
    activeMenu.remove();
    activeMenu = null;
  }
}

/* Muestra el selector de enlaces */
function showLinkMenu(event, links) {
  closeLinkMenu();

  const validLinks = links
    .map(safeUrl)
    .filter(Boolean);

  if (!validLinks.length) return;

  const menu = document.createElement('div');
  menu.className = 'link-selector';
  menu.setAttribute('role', 'menu');

  const heading = document.createElement('div');
  heading.className = 'menu-title';
  heading.textContent = '🔗 Selecciona un enlace';
  menu.appendChild(heading);

  validLinks.forEach((url, index) => {
    const option = document.createElement('a');

    option.href = url;
    option.target = '_blank';
    option.rel = 'noopener noreferrer';
    option.textContent = `Enlace ${index + 1}`;
    option.setAttribute('role', 'menuitem');

    option.addEventListener('click', () => {
      closeLinkMenu();
    });

    menu.appendChild(option);
  });

  document.body.appendChild(menu);
  activeMenu = menu;

  /* Coloca el menú superpuesto sobre la tarjeta */
  const rect = event.currentTarget.getBoundingClientRect();
  const menuRect = menu.getBoundingClientRect();

  /* Centra el menú sobre la tarjeta */
  let left = rect.left + (rect.width - menuRect.width) / 2;
  let top = rect.top + (rect.height - menuRect.height) / 2;

  /* Evita que se salga por los bordes de la pantalla */
  left = Math.max(10, Math.min(left, window.innerWidth - menuRect.width - 10));
  top = Math.max(10, Math.min(top, window.innerHeight - menuRect.height - 10));

  /* Aplica la posición */
  menu.style.left = `${left}px`;
  menu.style.top = `${top}px`;

  const firstOption = menu.querySelector('a');

  if (firstOption) firstOption.focus();
}

/* Gestiona el clic en cada tarjeta */
function handleCardClick(event, links) {
  event.preventDefault();

  if (!Array.isArray(links)) return;

  const validLinks = links
    .map(safeUrl)
    .filter(Boolean);

  if (validLinks.length === 1) {
    closeLinkMenu();

    window.open(
      validLinks[0],
      '_blank',
      'noopener,noreferrer'
    );

    return;
  }

  if (validLinks.length > 1) {
    showLinkMenu(event, links);
  }
}

/* Cierra el menú al hacer clic fuera */
document.addEventListener('click', event => {
  if (
    activeMenu &&
    !activeMenu.contains(event.target) &&
    !event.target.closest('.card')
  ) {
    closeLinkMenu();
  }
});

/* Cierra el menú con Escape */
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    closeLinkMenu();
  }
});

/* Cierra el menú al desplazarse */
window.addEventListener('scroll', closeLinkMenu, true);
window.addEventListener('resize', closeLinkMenu);

/* ============ RENDERIZADO ============ */

function render() {
  closeLinkMenu();

  const q = search.value.trim().toLowerCase();

  let list = ITEMS.filter(i =>
    !q ||
    i.title.toLowerCase().includes(q) ||
    String(i.id).toLowerCase().includes(q)
  );

  if (alfabetico) {
    list.sort((a, b) =>
      a.title.localeCompare(
        b.title,
        'es',
        {
          sensitivity: 'base',
          numeric: true
        }
      )
    );
  }

  if (!list.length) {
    grid.innerHTML =
      '<p class="empty">No hay resultados para tu búsqueda.</p>';

    return;
  }

  grid.innerHTML = list.map((i, index) => {

    const h = hue(i.title);

    const img = i.image && !i.image.endsWith('/')
      ? i.image
      : '';

    const bg = img
      ? `background-image:url('${esc(img)}')`
      : `background-image:linear-gradient(160deg,hsl(${h} 55% 38%),hsl(${(h + 50) % 360} 60% 18%))`;

    const initials = img
      ? ''
      : `<span class="initials">${esc(i.title.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase())}</span>`;

    const tags = [
      i.ampr ? { text: `ampr-emu-ng ${i.ampr.replace(/^ampr-emu-ng\s*/i, '')}`, className: 'ampr' } : null,
      i.firmware ? { text: i.firmware, className: 'firmware' } : null,
      i.credits ? { text: `Créditos: ${i.credits}`, className: 'credits' } : null,
      i.notes ? { text: `Notas: ${i.notes}`, className: 'notes' } : null
    ]
      .filter(Boolean)
      .map(t => `<span class="tag ${t.className}">${esc(t.text)}</span>`)
      .join('');

    return `
      <a class="card" href="#" data-index="${index}">
        <div class="cover" style="${bg}">
          ${initials}
          <span class="chip size">${esc(i.size)}</span>
          <span class="chip ver">${esc(i.version)}</span>
        </div>

        <div class="info">
          <p class="title" title="${esc(i.title)}">${esc(i.title)}</p>
          <p class="id">${esc(i.id)}</p>
          <div class="tags">${tags}</div>
        </div>
      </a>
    `;

  }).join('');

  /* Eventos de las tarjetas */
  grid.querySelectorAll('.card').forEach(card => {

    card.addEventListener('click', event => {

      const index = Number(card.dataset.index);
      const item = list[index];

      if (item) {
        handleCardClick(event, item.links);
      }

    });

  });
}

/* ============ BUSCADOR ============ */

search.addEventListener('input', render);

/* ============ VISTA CUADRÍCULA / LISTA ============ */

viewBtn.addEventListener('click', () => {
  grid.classList.toggle('list');
});

/* ============ CONTADOR ============ */

const n = ITEMS.length;

document.getElementById('count').textContent =
  n + (n === 1 ? ' Juego' : ' Juegos');

/* ============ ORDEN ALFABÉTICO ============ */

let alfabetico = false;

const sortBtn = document.getElementById('sort');

sortBtn.addEventListener('click', () => {

  alfabetico = !alfabetico;

  sortBtn.querySelector('.ico').textContent =
    alfabetico ? '🕒' : '🔤';

  sortBtn.querySelector('.txt').textContent =
    alfabetico ? 'Más recientes' : 'A–Z';

  const ayuda = alfabetico
    ? 'Ver los más recientes primero'
    : 'Ordenar de la A a la Z';

  sortBtn.title = ayuda;
  sortBtn.setAttribute('aria-label', ayuda);
  sortBtn.setAttribute('aria-pressed', alfabetico);

  render();

});

/* ============ INICIAR CATÁLOGO ============ */

render();

/* ============ AJUSTE DEL LOGO ============ */

const logo = document.getElementById('logo');
const brandText = document.getElementById('brand-text');

function fitLogo() {
  logo.style.height = brandText.offsetHeight + 'px';
}

logo.addEventListener('load', fitLogo);

logo.addEventListener('error', () => logo.remove());

window.addEventListener('load', fitLogo);
window.addEventListener('resize', fitLogo);

fitLogo();

</script>

</body>
</html>

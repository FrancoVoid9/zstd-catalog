header { max-width: 1500px; margin: 0 auto 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line);

          padding: 9px 16px; border-radius: 8px; transition: opacity .15s; }
.fb-btn:hover { opacity: .85; }
  .bar { display: grid; grid-template-columns: 1fr minmax(0, 420px) 1fr; gap: 10px; align-items: center; max-width: 1500px; margin: 0 auto 18px; }
  input, button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);

  input { grid-column: 2; width: 100%; }
  #view { grid-column: 3; justify-self: end; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .grid {
    max-width: 1500px; margin: 0 auto; display: grid; gap: 18px;
    grid-template-columns: repeat(6, 1fr);
  }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 800px)  { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 560px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
  .card {
    display: block; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; color: inherit; text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .cover { position: relative; aspect-ratio: 3 / 4; background-size: cover; background-position: center; }
  .cover .initials {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 44px; font-weight: 700; color: rgba(255,255,255,.85); letter-spacing: 1px;
  }
  .chip {
    position: absolute; bottom: 8px; font-size: 11px; font-weight: 700; color: #fff;
    background: rgba(0,0,0,.65); padding: 2px 7px; border-radius: 5px;
  }
  .chip.size { left: 8px; } .chip.ver { right: 8px; }
  .info { padding: 10px 12px 12px; }
  .title { font-size: 14px; font-weight: 700; margin: 0 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .id { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--tag-bg); color: var(--tag-text); border: 1px solid var(--line); }
  .tag.alt { background: var(--tag2-bg); color: var(--tag2-text); }
  /* list view */
  .grid.list { grid-template-columns: 1fr; gap: 10px; }
  .grid.list .card { display: flex; }
  .grid.list .cover { width: 72px; aspect-ratio: 1; flex: none; }
  .grid.list .initials { font-size: 22px; }
  .grid.list .chip { display: none; }
  .grid.list .info { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 0; }
  @media (max-width: 600px) { .bar { grid-template-columns: 1fr auto; } input { grid-column: 1; } #view { grid-column: 2; } }

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const viewBtn = document.getElementById('view');

function hue(str) {
  let h = 0;
  for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360;
  return h;
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function safeUrl(u) {
  try { const p = new URL(u, location.href); return /^https?:$/.test(p.protocol) ? p.href : '#'; }
  catch { return '#'; }
}

function render() {
  const q = search.value.trim().toLowerCase();
  const list = ITEMS.filter(i =>
    !q || i.title.toLowerCase().includes(q) || String(i.id).toLowerCase().includes(q)
  );
  if (!list.length) { grid.innerHTML = '<p class="empty">No hay resultados para tu búsqueda.</p>'; return; }
  grid.innerHTML = list.map(i => {
    const h = hue(i.title);
    const bg = i.image
      ? `background-image:url('${esc(i.image)}')`
      : `background-image:linear-gradient(160deg,hsl(${h} 55% 38%),hsl(${(h + 50) % 360} 60% 18%))`;
    const initials = i.image ? '' :
      `<span class="initials">${esc(i.title.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase())}</span>`;
    const tags = (i.tags || []).map(t =>
      t.startsWith('alt:') ? `<span class="tag alt">${esc(t.slice(4))}</span>` : `<span class="tag">${esc(t)}</span>`
    ).join('');
    return `<a class="card" href="${esc(safeUrl(i.link))}" target="_blank" rel="noopener noreferrer">
      <div class="cover" style="${bg}">${initials}
        <span class="chip size">${esc(i.size)}</span><span class="chip ver">${esc(i.version)}</span>
      </div>
      <div class="info">
        <p class="title" title="${esc(i.title)}">${esc(i.title)}</p>
        <p class="id">${esc(i.id)}</p>
        <div class="tags">${tags}</div>
      </div></a>`;
  }).join('');
}

search.addEventListener('input', render);
viewBtn.addEventListener('click', () => grid.classList.toggle('list'));

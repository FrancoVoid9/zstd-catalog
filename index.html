header h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: .3px; }
header p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.brand { display: flex; align-items: center; gap: 14px; }

.count { color: var(--text); font-weight: 600; }
.fb-btn {

input, button {

input { grid-column: 2; width: 100%; }

button { cursor: pointer; }

.grid {

@media (max-width: 800px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 560px) { .grid { grid-template-columns: repeat(2, 1fr); } }

.card {

.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.cover {

  background-size: cover; background-position: center;
}
.cover .initials {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 44px; font-weight: 700;
  color: rgba(255,255,255,.85); letter-spacing: 1px;
}
.chip {
  position: absolute; bottom: 8px; font-size: 11px;
  font-weight: 700; color: #fff; background: rgba(0,0,0,.65);
  padding: 2px 7px; border-radius: 5px;
}
.chip.size { left: 8px; }
.chip.ver { right: 8px; }
.info { padding: 10px 12px 12px; }
.title {
  font-size: 14px; font-weight: 700; margin: 0 0 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.id { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag {
  font-size: 11px; padding: 2px 8px; border-radius: 6px;
  background: var(--tag-bg); color: var(--tag-text);
  border: 1px solid var(--line);
}
.tag.alt { background: var(--tag2-bg); color: var(--tag2-text); }

/* Selector de enlaces */
.link-selector {
  position: fixed;
  z-index: 10000;
  display: flex;
  flex-direction: column;
  min-width: 145px;
  max-width: 220px;
  padding: 6px;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 9px;
  box-shadow: 0 8px 28px rgba(0,0,0,.4);
  animation: menuAppear .12s ease-out;
}

@keyframes menuAppear {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

.link-selector .menu-title {
  padding: 7px 10px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;

.link-selector a {

.link-selector a:hover,

.grid.list { grid-template-columns: 1fr; gap: 10px; }

.grid.list .chip { display: none; }
.grid.list .info {

.empty {

@media (max-width: 600px) {

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const viewBtn = document.getElementById('view');

let activeMenu = null;

function hue(str) {
  let h = 0;
  for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360;
  return h;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function safeUrl(u) {
  try {
    const p = new URL(u, location.href);
    return /^https?:$/.test(p.protocol) ? p.href : null;
  } catch {
    return null;
  }
}

/* Cierra el selector si ya hay uno abierto */
function closeLinkMenu() {
  if (activeMenu) {
    activeMenu.remove();
    activeMenu = null;
  }
}

/* Muestra el selector de enlaces */
function showLinkMenu(event, links) {
  closeLinkMenu();

  const validLinks = links
    .map(safeUrl)
    .filter(Boolean);

  if (!validLinks.length) return;

  const menu = document.createElement('div');
  menu.className = 'link-selector';
  menu.setAttribute('role', 'menu');

  const heading = document.createElement('div');
  heading.className = 'menu-title';
  heading.textContent = 'Selecciona un enlace';
  menu.appendChild(heading);

  validLinks.forEach((url, index) => {
    const option = document.createElement('a');
    option.href = url;
    option.target = '_blank';
    option.rel = 'noopener noreferrer';
    option.textContent = `Enlace ${index + 1}`;
    option.setAttribute('role', 'menuitem');

    option.addEventListener('click', () => {
      closeLinkMenu();
    });

    menu.appendChild(option);
  });

  document.body.appendChild(menu);
  activeMenu = menu;

  /* Coloca el menú junto a la tarjeta */
  const rect = event.currentTarget.getBoundingClientRect();
  const menuRect = menu.getBoundingClientRect();

  let left = rect.left;
  let top = rect.bottom + 6;

  /* Evita que se salga por la derecha */
  if (left + menuRect.width > window.innerWidth - 10) {
    left = window.innerWidth - menuRect.width - 10;
  }

  /* Si no cabe abajo, lo muestra encima */
  if (top + menuRect.height > window.innerHeight - 10) {
    top = rect.top - menuRect.height - 6;
  }

  /* Evita que se salga por arriba */
  top = Math.max(10, top);
  left = Math.max(10, left);

  menu.style.left = `${left}px`;
  menu.style.top = `${top}px`;

  const firstOption = menu.querySelector('a');
  if (firstOption) firstOption.focus();
}

/* Gestiona el clic en cada tarjeta */
function handleCardClick(event, links) {
  event.preventDefault();

  if (!Array.isArray(links)) return;

  const validLinks = links
    .map(safeUrl)
    .filter(Boolean);

  if (validLinks.length === 1) {
    closeLinkMenu();
    window.open(validLinks[0], '_blank', 'noopener,noreferrer');
    return;
  }

  if (validLinks.length > 1) {
    showLinkMenu(event, links);
  }
}

/* Cierra el menú al hacer clic fuera */
document.addEventListener('click', event => {
  if (
    activeMenu &&
    !activeMenu.contains(event.target) &&
    !event.target.closest('.card')
  ) {
    closeLinkMenu();
  }
});

/* Cierra el menú con Escape */
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    closeLinkMenu();
  }
});

/* Cierra el menú al desplazarse */
window.addEventListener('scroll', closeLinkMenu, true);
window.addEventListener('resize', closeLinkMenu);

function render() {
  closeLinkMenu();

  const q = search.value.trim().toLowerCase();

  const list = ITEMS.filter(i =>
    !q || i.title.toLowerCase().includes(q) ||
    String(i.id).toLowerCase().includes(q)
  );

  if (!list.length) {
    grid.innerHTML = '<p class="empty">No hay resultados para tu búsqueda.</p>';
    return;
  }

  grid.innerHTML = list.map((i, index) => {
    const h = hue(i.title);

    const bg = i.image
      ? `background-image:url('${esc(i.image)}')`
      : `background-image:linear-gradient(160deg,hsl(${h} 55% 38%),hsl(${(h + 50) % 360} 60% 18%))`;

    const initials = i.image ? '' :
      `<span class="initials">${esc(i.title.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase())}</span>`;

    const tags = [
      i.ampr ? `ampr-emu-ng ${i.ampr}` : '',
      i.backport ? i.backport : '',
      i.credits ? `Créditos: ${i.credits}` : '',
      i.notes ? `Notas: ${i.notes}` : ''
    ].filter(Boolean).map(t =>
      `<span class="tag">${esc(t)}</span>`
    ).join('');

    return `
      <a class="card" href="#" data-index="${index}">
        <div class="cover" style="${bg}">
          ${initials}
          <span class="chip size">${esc(i.size)}</span>
          <span class="chip ver">${esc(i.version)}</span>
        </div>
        <div class="info">
          <p class="title" title="${esc(i.title)}">${esc(i.title)}</p>
          <p class="id">${esc(i.id)}</p>
          <div class="tags">${tags}</div>
        </div>
      </a>
    `;
  }).join('');

  /* Eventos de las tarjetas */
  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', event => {
      const index = Number(card.dataset.index);
      const item = list[index];

      if (item) {
        handleCardClick(event, item.links);
      }
    });
  });
}

search.addEventListener('input', render);

viewBtn.addEventListener('click', () => {
  grid.classList.toggle('list');
});

const n = ITEMS.length;

document.getElementById('count').textContent =
  n + (n === 1 ? ' Juego' : ' Juegos');

render();

const logo = document.getElementById('logo');
const brandText = document.getElementById('brand-text');

function fitLogo() {
  logo.style.height = brandText.offsetHeight + 'px';
}

logo.addEventListener('load', fitLogo);
logo.addEventListener('error', () => logo.remove());

window.addEventListener('load', fitLogo);
window.addEventListener('resize', fitLogo);

fitLogo();

</script>
